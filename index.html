    <script>
      (function() {
        var isROError = function(msg) {
          return typeof msg === 'string' && (
            msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            msg.indexOf('ResizeObserver loop limit exceeded') !== -1
          );
        };
        window.addEventListener('error', function(e) {
          if (isROError(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);
        if (window.ResizeObserver) {
          var NativeRO = window.ResizeObserver;
          window.ResizeObserver = function(callback) {
            return new NativeRO(function(entries, observer) {
              window.requestAnimationFrame(function() {
                try {
                  callback(entries, observer);
                } catch (err) {
                  if (err && isROError(err.message)) return;
                  throw err;
                }
              });
            });
          };
          window.ResizeObserver.prototype = NativeRO.prototype;
        }
      })();
    </script>
